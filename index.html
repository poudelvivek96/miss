<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>valentine · romantic music · flying emojis · typing letter</title>
  <style>
    /* ===== RESET & GLOBAL ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Dancing Script', 'Great Vibes', cursive, system-ui, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background: #ffe6f0;
    }

    .page {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      transition: opacity 1.2s ease-in-out;
      opacity: 0;
      pointer-events: none;
      -webkit-overflow-scrolling: touch;
    }

    .page.active {
      opacity: 1;
      pointer-events: all;
      z-index: 10;
    }

    /* ===== FLYING EMOJI CONTAINER ===== */
    #flyingEmojiContainer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
      overflow: hidden;
    }

    .flying-emoji {
      position: absolute;
      font-size: 2.5rem;
      animation: fly 3s ease-out forwards;
      filter: drop-shadow(0 0 10px rgba(255, 105, 180, 0.8));
      z-index: 10000;
      pointer-events: none;
    }

    @keyframes fly {
      0% {
        transform: translate(0, 0) rotate(0deg) scale(0.5);
        opacity: 1;
      }
      25% {
        transform: translate(calc(100vw * (var(--x) - 0.5)), calc(-50vh * var(--y))) rotate(180deg) scale(1.2);
        opacity: 0.9;
      }
      50% {
        transform: translate(calc(50vw * var(--x)), calc(-80vh * var(--y))) rotate(360deg) scale(1.5);
        opacity: 0.8;
      }
      75% {
        transform: translate(calc(-30vw * var(--x)), calc(-120vh * var(--y))) rotate(540deg) scale(1);
        opacity: 0.5;
      }
      100% {
        transform: translate(calc(100vw * var(--x) - 50vw), calc(-150vh * var(--y))) rotate(720deg) scale(0.2);
        opacity: 0;
      }
    }

    /* ===== PAGE 1 – LANDING ===== */
    #page1 {
      background: radial-gradient(circle at 30% 30%, #ffd9e8, #ffb3c6 70%, #ff99aa);
      position: relative;
    }

    /* floating hearts & sparkles */
    #float-container {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 0;
    }

    .float-heart, .float-sparkle {
      position: absolute;
      color: rgba(255, 80, 120, 0.7);
      font-size: 1.8rem;
      user-select: none;
      opacity: 0.8;
      animation: floatUp 8s linear infinite;
      filter: drop-shadow(0 0 8px rgba(255, 105, 180, 0.7));
      pointer-events: none;
      z-index: 1;
    }

    .float-sparkle {
      font-size: 1.2rem;
      color: #fff9b0;
      text-shadow: 0 0 10px gold, 0 0 20px #ffb347;
      animation: floatUp 6s ease-in infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) rotate(0deg) scale(0.5);
        opacity: 0.2;
      }
      20% { opacity: 1; }
      80% { opacity: 0.9; }
      100% {
        transform: translateY(-20vh) rotate(20deg) scale(1.2);
        opacity: 0;
      }
    }

    .valentine-card {
      position: relative;
      top: 50%;
      transform: translateY(-50%);
      margin: 0 auto;
      text-align: center;
      z-index: 20;
      width: 90%;
      max-width: 900px;
      background: rgba(255, 245, 250, 0.3);
      backdrop-filter: blur(5px);
      border-radius: 60px 20px 60px 20px;
      padding: 2rem 2rem 3rem;
      box-shadow: 0 20px 40px rgba(255, 20, 100, 0.3), 0 0 0 4px rgba(255, 255, 255, 0.5) inset, 0 0 40px #ffa5c3;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    /* Photo frame styles */
    .photo-frame {
      margin: 2rem auto 1.5rem;
      width: min(220px, 50vw);
      height: min(240px, 55vw);
      background: white;
      padding: 12px 12px 35px 12px;
      box-shadow: 0 15px 25px rgba(0,0,0,0.2), 0 0 0 2px #ffb6c1, 0 0 0 5px white;
      transform: rotate(-2deg);
      transition: all 0.4s ease;
      border-radius: 10px 10px 30px 10px;
      cursor: pointer;
    }

    .photo-frame:hover {
      transform: rotate(0deg) scale(1.05);
      box-shadow: 0 25px 35px rgba(255, 80, 120, 0.4), 0 0 0 3px #ff99bb, 0 0 0 8px white;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 5px;
      display: block;
    }

    .photo-caption {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(1rem, 4vw, 1.2rem);
      color: #c24b6b;
      margin-top: 5px;
      text-align: center;
      letter-spacing: 1px;
    }

    .main-message {
      font-size: clamp(2.5rem, 8vw, 4rem);
      font-family: 'Dancing Script', 'Great Vibes', cursive;
      font-weight: 700;
      color: #a02b4e;
      text-shadow: 2px 2px 0 #ffc1cc, 4px 4px 10px #ff99bb, 0 0 20px #ffffff;
      line-height: 1.2;
      animation: glowPulse 2.5s infinite alternate;
      word-break: break-word;
      padding: 0 10px;
    }

    @keyframes glowPulse {
      0% { text-shadow: 2px 2px 0 #ffc1cc, 0 0 20px #fff, 0 0 30px #ff80a5; }
      100% { text-shadow: 4px 4px 0 #ffa5b9, 0 0 40px #ffe600, 0 0 60px #ff4080; }
    }

    .sweet-text {
      font-size: clamp(1.2rem, 5vw, 2rem);
      margin: 0.5rem 0;
      font-family: 'Georgia', 'Times New Roman', serif;
      color: #5e1e36;
      background: rgba(255, 220, 240, 0.6);
      display: inline-block;
      padding: 0.5rem 2rem;
      border-radius: 40px;
      backdrop-filter: blur(4px);
      max-width: 90%;
    }

    .btn-open {
      background: linear-gradient(145deg, #ff99bb, #ff4d7a);
      border: none;
      padding: 1.2rem 3.5rem;
      font-size: clamp(1.5rem, 5vw, 2rem);
      font-family: 'Dancing Script', cursive;
      font-weight: 600;
      color: white;
      border-radius: 60px;
      cursor: pointer;
      box-shadow: 0 10px 0 #a1284a, 0 10px 30px #ff7f9f;
      margin-top: 1.5rem;
      border: 2px solid #fff9;
      transition: all 0.2s ease;
      width: auto;
      max-width: 90%;
    }

    .btn-open:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 0 #a1284a, 0 20px 40px #ffb6c1;
    }

    .btn-open:active {
      transform: translateY(5px);
      box-shadow: 0 5px 0 #a1284a;
    }

    /* Thumbnails - now with interactive flying effects */
    .photo-thumbnails {
      display: flex;
      gap: clamp(1rem, 3vw, 1.5rem);
      justify-content: center;
      flex-wrap: wrap;
      margin: 2rem 0 0;
      position: absolute;
      bottom: clamp(10px, 3vh, 30px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      width: 100%;
      padding: 0 10px;
    }

    .thumb-frame {
      width: clamp(70px, 15vw, 90px);
      height: clamp(70px, 15vw, 90px);
      border-radius: 50%;
      background: white;
      padding: 8px;
      box-shadow: 0 8px 20px #ff99bb;
      cursor: pointer;
      transition: all 0.3s;
      border: 3px solid #ffb3cc;
      position: relative;
      overflow: hidden;
    }

    .thumb-frame:hover {
      transform: scale(1.2) rotate(5deg);
      box-shadow: 0 15px 30px #ff4d7a;
      border-color: #ff4d7a;
    }

    .thumb-frame:active {
      transform: scale(0.95);
    }

    .thumb-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .thumb-placeholder {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(145deg, #ffccdd, #ff99bb);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      transition: all 0.3s;
    }

    .thumb-frame:hover .thumb-placeholder {
      transform: scale(1.1);
    }

    /* Tooltip for flying effect */
    .thumb-frame::after {
      content: attr(data-effect);
      position: absolute;
      bottom: -30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.9);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: clamp(0.7rem, 2vw, 1rem);
      color: #a02b4e;
      white-space: nowrap;
      opacity: 0;
      transition: 0.3s;
      pointer-events: none;
      border: 1px solid #ff99bb;
      font-family: 'Dancing Script', cursive;
    }

    .thumb-frame:hover::after {
      opacity: 1;
      bottom: -40px;
    }

    /* ===== PAGE 2 – LOVE LETTER with TYPING EFFECT ===== */
    #page2 {
      background: #fff0f5;
      background-image: radial-gradient(circle at 20% 30%, #ffe6f1 5%, transparent 25%),
                        radial-gradient(circle at 90% 70%, #ffd9e8 8%, transparent 30%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 1rem;
    }

    .letter-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: clamp(1rem, 3vw, 2rem);
      max-width: 1200px;
      width: 100%;
    }

    .letter-paper {
      flex: 2;
      min-width: min(300px, 90%);
      background: #fff9fc;
      border-radius: 40px 20px 40px 20px;
      padding: clamp(1.5rem, 4vw, 2.5rem);
      box-shadow: 0 40px 60px rgba(210, 80, 130, 0.3), 0 0 0 6px #ffe2f0;
      transform: rotate(0.5deg);
      animation: letterAppear 1.2s ease;
      border: 2px solid #ffbfd7;
      max-height: 70vh;
      overflow-y: auto;
      width: 100%;
    }

    @keyframes letterAppear {
      0% { opacity: 0; transform: scale(0.2) rotate(-10deg); }
      70% { transform: scale(1.02) rotate(1deg); }
      100% { opacity: 1; transform: scale(1) rotate(0.5deg); }
    }

    /* Typing message container */
    .typing-message {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: clamp(1.2rem, 4vw, 1.6rem);
      line-height: 1.6;
      color: #4f2439;
      min-height: min(280px, 40vh);
      position: relative;
      margin: 1.5rem 0;
      white-space: pre-wrap;
      word-wrap: break-word;
      border-left: 3px solid #ffb0cc;
      padding-left: 1.5rem;
      font-style: italic;
      background: rgba(255, 240, 245, 0.5);
      border-radius: 20px;
      padding: 1.5rem;
    }

    .cursor {
      display: inline-block;
      width: 3px;
      height: 1.8rem;
      background-color: #ff4d7a;
      margin-left: 3px;
      vertical-align: middle;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    .heart-photo-frame {
      width: clamp(220px, 50vw, 280px);
      height: clamp(220px, 50vw, 280px);
      background: #ffe2f0;
      border-radius: 50% 50% 45% 45%;
      padding: 15px;
      box-shadow: 0 20px 30px #ffb0c9, 0 0 0 5px white, 0 0 0 8px #ff99bb;
      transform: rotate(-3deg);
      transition: all 0.5s ease;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
    }

    .heart-photo-frame:hover {
      transform: rotate(0deg) scale(1.03);
      box-shadow: 0 30px 40px #ff80a5, 0 0 0 7px white, 0 0 0 12px #ff4d7a;
    }

    .heart-photo-frame img {
      width: 90%;
      height: 90%;
      object-fit: cover;
      border-radius: 50% 50% 45% 45%;
      border: 3px solid white;
    }

    .heart-placeholder {
      width: 90%;
      height: 90%;
      border-radius: 50% 50% 45% 45%;
      background: linear-gradient(135deg, #ffc0cb, #ff99bb);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(2rem, 8vw, 4rem);
      color: white;
      border: 3px solid white;
      overflow: hidden;
    }
    
    .heart-placeholder img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50% 50% 45% 45%;
    }

    .letter-paper h2 {
      font-size: clamp(2rem, 6vw, 3rem);
      font-family: 'Dancing Script', cursive;
      color: #c72462;
      border-bottom: 3px dotted #ffb0cc;
      padding-bottom: 0.8rem;
      margin-bottom: 1rem;
      word-break: break-word;
    }

    .signature {
      margin-top: 2rem;
      font-size: clamp(1.8rem, 5vw, 2.2rem);
      font-family: 'Dancing Script', cursive;
      text-align: right;
      color: #b32e5a;
      opacity: 0;
      transition: opacity 1.5s ease;
    }

    .btn-back {
      background: #ffccdd;
      border: 2px solid white;
      font-size: clamp(1.4rem, 4vw, 1.8rem);
      padding: 0.8rem 2.5rem;
      margin-top: 2rem;
      border-radius: 80px;
      font-family: 'Dancing Script', cursive;
      color: #9f2b50;
      cursor: pointer;
      box-shadow: 0 8px 0 #bc6f8f;
      transition: 0.15s;
    }

    .btn-back:hover {
      transform: translateY(-5px);
      box-shadow: 0 13px 0 #bc6f8f;
    }
    
    .btn-back:active {
      transform: translateY(5px);
      box-shadow: 0 3px 0 #bc6f8f;
    }

    .deco-heart {
      position: absolute;
      color: #ff8db3;
      font-size: 2.2rem;
      animation: wobble 5s infinite;
      pointer-events: none;
    }

    @keyframes wobble {
      0%,100% { transform: rotate(-5deg) translateY(0); }
      50% { transform: rotate(10deg) translateY(-15px); }
    }

    /* Mobile specific adjustments */
    @media (max-width: 768px) {
      .valentine-card {
        padding: 1.5rem 1rem 2rem;
        width: 95%;
      }
      
      .photo-frame {
        margin: 1rem auto;
      }
      
      .thumb-frame::after {
        display: none; /* Hide tooltips on mobile for better touch experience */
      }
      
      .letter-container {
        flex-direction: column;
      }
      
      .photo-side {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      
      .btn-back {
        margin-top: 1rem;
        margin-bottom: 1rem;
      }
    }
    
    /* Small phone adjustments */
    @media (max-width: 480px) {
      .thumb-frame {
        width: 60px;
        height: 60px;
      }
      
      .photo-thumbnails {
        gap: 0.8rem;
        bottom: 10px;
      }
      
      .typing-message {
        padding: 1rem;
        min-height: 200px;
      }
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">
</head>
<body>
  <!-- HIDDEN AUDIO FOR AUTOPLAY (NO VISIBLE BUTTON) -->
  <audio id="bgMusic" loop preload="auto" style="display: none;">
    <source src="Mooskaan - Sajjan Raj Vaidya (youtube).mp3" type="audio/mpeg">
    <!-- This is a royalty-free romantic melody that will autoplay -->
  </audio>
  <script>
window.onload = function () {
  let song = document.getElementById("bgMusic");

  song.currentTime = 257;   // ⏱ Start from 30 seconds
  song.play();             // Play automatically
};
</script>

  <!-- FLYING EMOJI CONTAINER -->
  <div id="flyingEmojiContainer"></div>

  <!-- PAGE 1 – LANDING -->
  <div id="page1" class="page active">
    <div id="float-container"></div>
    
    <div class="valentine-card">
      <div class="main-message">Happy Valentine’s Day sadhana❤️😘🫂</div>
      
      <!-- PHOTO SPOT 1 – Main polaroid -->
      <div class="photo-frame" id="photoSpot1" onclick="triggerPhotoUpload(1)">
        <img id="page1Photo" src="1769434104945.png"
             alt="Your Valentine photo">
        <div class="photo-caption">you & me ❤️</div>
      </div>
      
      <div class="sweet-text">my love, my heart, my forever</div>
      <button class="btn-open" id="openLetterBtn">💌 Open My Love Letter 💌</button>
    </div>

    <!-- Thumbnails with flying effects -->
    <div class="photo-thumbnails">
      <!-- ❤️ Button - flies hearts -->
      <div class="thumb-frame" id="heartBtn" onclick="triggerFlyingEmojis('❤️', 25)" data-effect="❤️ flies everywhere">
        <div class="thumb-placeholder">❤️</div>
      </div>
      
      <!-- 💕 Button - flies 😘 kisses -->
      <div class="thumb-frame" id="kissBtn" onclick="triggerFlyingEmojis('😘', 25)" data-effect="😘 kisses fly">
        <div class="thumb-placeholder">💕</div>
      </div>
      
      <!-- 🌹 Button - flies roses -->
      <div class="thumb-frame" id="roseBtn" onclick="triggerFlyingEmojis('🌹', 20)" data-effect="🌹 roses everywhere">
        <div class="thumb-placeholder">🌹</div>
      </div>
    </div>
  </div>

  <!-- PAGE 2 – LOVE LETTER with AUTO TYPING MESSAGE -->
  <div id="page2" class="page">
    <div style="position: absolute; width: 100%; height: 100%; pointer-events: none;">
      <span class="deco-heart" style="top: 10%; left: 5%;">❤️</span>
      <span class="deco-heart" style="top: 70%; left: 90%;">❤️</span>
      <span class="deco-heart" style="top: 20%; left: 85%;">🌸</span>
    </div>
    
    <div class="letter-container">
      <!-- Letter paper with AUTO TYPING EFFECT -->
      <div class="letter-paper">
        <h2>To my dearest Valentine Sadhana 💕</h2>
        
        <!-- TYPING MESSAGE CONTAINER -->
        <div class="typing-message" id="typingMessage">
          <span id="messageText"></span><span class="cursor" id="cursor"></span>
        </div>
        
        <div class="signature" id="signature">All yours miss💋</div>
      </div>

      <!-- PHOTO SPOT 2 – Heart frame -->
      <div class="photo-side">
        <div class="heart-photo-frame" id="photoSpot2" onclick="triggerPhotoUpload(2)">
          <div class="heart-placeholder" id="page2Heart">
            <img src="IMG_20260214_120459~2.jpg" alt="" srcset="">
          </div>
        </div>
        <p style="font-family: 'Dancing Script'; font-size: clamp(1.4rem, 4vw, 1.8rem); color: #b32e5a;">my favorite view</p>
      </div>
    </div>

    <button class="btn-back" id="backBtn">🔙 back to beginning</button>
  </div>

  <script>
    (function() {
      // ===== AUTOPLAY MUSIC (NO VISIBLE BUTTON) =====
      const audio = document.getElementById('bgMusic');
      audio.volume = 0.3; // Set comfortable volume
      
      // Function to attempt autoplay
      function attemptAutoplay() {
        audio.play()
          .then(() => {
            console.log('Music autoplay started successfully');
          })
          .catch(error => {
            console.log('Autoplay was prevented:', error);
            // Some browsers block autoplay - we'll try again on user interaction
            // Add a one-time listener for any user interaction to start music
            const startAudioOnInteraction = () => {
              audio.play()
                .then(() => {
                  console.log('Music started after user interaction');
                })
                .catch(e => console.log('Still failed:', e));
              document.removeEventListener('click', startAudioOnInteraction);
              document.removeEventListener('touchstart', startAudioOnInteraction);
              document.removeEventListener('keydown', startAudioOnInteraction);
            };
            
            document.addEventListener('click', startAudioOnInteraction);
            document.addEventListener('touchstart', startAudioOnInteraction);
            document.addEventListener('keydown', startAudioOnInteraction);
          });
      }
      
      // Try to autoplay when page loads
      window.addEventListener('load', () => {
        setTimeout(attemptAutoplay, 500); // Small delay for better browser compatibility
      });

      // ===== FLYING EMOJI FUNCTION =====
      const flyingContainer = document.getElementById('flyingEmojiContainer');
      
      window.triggerFlyingEmojis = function(emoji, count) {
        for (let i = 0; i < count; i++) {
          createFlyingEmoji(emoji);
        }
      };

      function createFlyingEmoji(emoji) {
        const flyingEmoji = document.createElement('div');
        flyingEmoji.className = 'flying-emoji';
        flyingEmoji.textContent = emoji;
        
        // Random starting position (from anywhere on screen)
        const startX = Math.random() * window.innerWidth;
        const startY = Math.random() * window.innerHeight;
        
        // Random direction factors for CSS variables
        const xFactor = (Math.random() * 2 - 1).toFixed(2);
        const yFactor = (Math.random() * 0.5 + 0.5).toFixed(2);
        
        flyingEmoji.style.left = startX + 'px';
        flyingEmoji.style.top = startY + 'px';
        flyingEmoji.style.setProperty('--x', xFactor);
        flyingEmoji.style.setProperty('--y', yFactor);
        flyingEmoji.style.fontSize = (2 + Math.random() * 3) + 'rem';
        
        // Random animation duration between 2.5 and 4.5 seconds
        flyingEmoji.style.animationDuration = (2.5 + Math.random() * 2) + 's';
        
        flyingContainer.appendChild(flyingEmoji);
        
        // Remove after animation completes
        setTimeout(() => {
          if (flyingEmoji.parentNode) {
            flyingEmoji.remove();
          }
        }, 4000);
      }

      // ===== FLOATING HEARTS =====
      const floatContainer = document.getElementById('float-container');
      
      function createFloatingElement(type = 'heart') {
        const el = document.createElement('div');
        if (type === 'heart') {
          el.className = 'float-heart';
          const heartSymbols = ['❤️', '🧡', '💛', '💚', '💙', '💜', '🩷', '💖', '💕', '💗'];
          el.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
          el.style.left = Math.random() * 100 + '%';
          el.style.animationDuration = 5 + Math.random() * 10 + 's';
        } else {
          el.className = 'float-sparkle';
          el.innerText = '✨';
          el.style.left = Math.random() * 100 + '%';
          el.style.animationDuration = 4 + Math.random() * 7 + 's';
        }
        el.style.top = Math.random() * 100 + '%';
        floatContainer.appendChild(el);
        setTimeout(() => { if (el.parentNode) el.remove(); }, 15000);
      }

      // Initial floating elements
      for (let i = 0; i < 25; i++) {
        createFloatingElement(i % 3 === 0 ? 'sparkle' : 'heart');
      }

      // Keep adding new floating elements
      setInterval(() => {
        for (let i = 0; i < 3; i++) {
          createFloatingElement(Math.random() > 0.6 ? 'sparkle' : 'heart');
        }
      }, 2000);

      // ===== NAVIGATION =====
      const page1 = document.getElementById('page1');
      const page2 = document.getElementById('page2');
      const openBtn = document.getElementById('openLetterBtn');
      const backBtn = document.getElementById('backBtn');

      openBtn.addEventListener('click', () => {
        page1.classList.remove('active');
        page2.classList.add('active');
        startTyping();
      });

      backBtn.addEventListener('click', () => {
        page2.classList.remove('active');
        page1.classList.add('active');
        pauseTyping();
      });

      // ===== AUTO TYPING MESSAGE EFFECT =====
      const messageText = document.getElementById('messageText');
      const cursor = document.getElementById('cursor');
      const signature = document.getElementById('signature');
      
      const fullMessage = `Every moment with you is special💕 and every smile of yours means the world to me 😘😘 Your kindness, your smile, and your presence make my heart happy, every day with you feels special😊 and my heart feels happy when I think of you💕🫂 On this Valentine’s Day, I just want you to know how lucky I feel to have you in my life ❤️🫂😘, I love you sadhana 💖😘  `;

      let currentIndex = 0;
      let typingInterval = null;
      let isPage2Active = false;

      function typeNextCharacter() {
        if (!isPage2Active) return;
        
        if (currentIndex < fullMessage.length) {
          messageText.textContent += fullMessage.charAt(currentIndex);
          currentIndex++;
          
          const typingDiv = document.getElementById('typingMessage');
          typingDiv.scrollTop = typingDiv.scrollHeight;
        } else {
          clearInterval(typingInterval);
          typingInterval = null;
          cursor.style.opacity = '0';
          signature.style.opacity = '1';
        }
      }

      function startTyping() {
        isPage2Active = true;
        
        if (currentIndex >= fullMessage.length) {
          signature.style.opacity = '1';
          cursor.style.opacity = '0';
          return;
        }
        
        if (typingInterval) {
          clearInterval(typingInterval);
        }
        
        typingInterval = setInterval(typeNextCharacter, 60);
        cursor.style.opacity = '1';
      }

      function pauseTyping() {
        isPage2Active = false;
        if (typingInterval) {
          clearInterval(typingInterval);
          typingInterval = null;
        }
      }

      // ===== PHOTO UPLOAD FUNCTIONALITY =====
      window.triggerPhotoUpload = function(spotId) {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.style.display = 'none';
        document.body.appendChild(input);

        input.onchange = function(e) {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
              const imageUrl = event.target.result;
              
              switch(spotId) {
                case 1:
                  document.getElementById('page1Photo').src = imageUrl;
                  break;
                case 2:
                  const heartFrame = document.getElementById('photoSpot2');
                  heartFrame.innerHTML = `<img src="${imageUrl}" style="width:90%; height:90%; object-fit:cover; border-radius:50% 50% 45% 45%; border:3px solid white;">`;
                  break;
              }
            };
            reader.readAsDataURL(file);
          }
          document.body.removeChild(input);
        };
        input.click();
      };

      // Hover sparkles on photos
      const photoFrames = document.querySelectorAll('.photo-frame, .heart-photo-frame, .thumb-frame');
      photoFrames.forEach(frame => {
        frame.addEventListener('mouseenter', (e) => {
          for (let i = 0; i < 3; i++) {
            const spark = document.createElement('span');
            spark.innerText = '✨';
            spark.style.position = 'absolute';
            spark.style.left = e.pageX + (Math.random() - 0.5) * 30 + 'px';
            spark.style.top = e.pageY + (Math.random() - 0.5) * 30 + 'px';
            spark.style.fontSize = '1.2rem';
            spark.style.pointerEvents = 'none';
            spark.style.zIndex = '999';
            spark.style.transition = 'all 0.8s ease-out';
            document.body.appendChild(spark);
            setTimeout(() => {
              spark.style.transform = `translate(${(Math.random() - 0.5) * 40}px, -20px) scale(0.1)`;
              spark.style.opacity = '0';
            }, 10);
            setTimeout(() => spark.remove(), 800);
          }
        });
      });

      // Check page activity periodically for typing
      setInterval(() => {
        isPage2Active = page2.classList.contains('active');
        if (!isPage2Active && typingInterval) {
          clearInterval(typingInterval);
          typingInterval = null;
        }
      }, 500);

      // Add click effect to thumbnails for visual feedback
      document.querySelectorAll('.thumb-frame').forEach(btn => {
        btn.addEventListener('click', function(e) {
          // Add a quick scale animation for feedback
          this.style.transform = 'scale(0.9)';
          setTimeout(() => {
            this.style.transform = '';
          }, 200);
        });
      });

    })();
  </script>

  <style>
    /* Additional styles */
    .typing-message {
      background: rgba(255, 240, 245, 0.5);
      transition: all 0.3s;
      min-height: 280px;
    }
    
    #signature {
      transition: opacity 1.5s ease;
    }
    
    .photo-frame, .heart-photo-frame, .thumb-frame {
      cursor: pointer;
      position: relative;
    }
        
    .heart-photo-frame::after {
      position: absolute;
      bottom: -20px;
      font-size: 1rem;
      background: white;
      padding: 2px 12px;
      border-radius: 20px;
      opacity: 0;
      transition: 0.3s;
      white-space: nowrap;
    }
    
    .heart-photo-frame:hover::after {
      opacity: 0.9;
      bottom: -25px;
    }
    
    /* Ensure flying emojis are above everything */
    #flyingEmojiContainer {
      pointer-events: none;
      z-index: 10000;
    }
    
    /* Thumbnail specific styles */
    .thumb-frame {
      box-shadow: 0 0 20px rgba(255, 105, 180, 0.5);
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 20px rgba(255, 105, 180, 0.5); }
      50% { box-shadow: 0 0 30px rgba(255, 20, 147, 0.8); }
    }
  </style>
</body>
</html>
